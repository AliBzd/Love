<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ayati 💕 — Our Love Story</title>
    <meta name="description" content="Ayati — Our Love Story. Letters, memories, and sweet words between Ali and Aya." />
    <meta name="theme-color" content="#1a0a1e" />

    <!-- PWA / Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ayati" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ===================== LOGIN ===================== -->
    <div id="view-login" class="view active">
        <canvas id="hearts-canvas"></canvas>
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-hearts">
                    <span class="logo-heart left">💙</span>
                    <span class="logo-heart right">💗</span>
                </div>
                <h1 class="login-title">Ayati</h1>
                <p class="login-subtitle">Our love, in one place</p>
            </div>

            <div id="login-select" class="login-select">
                <p class="login-prompt">Who are you?</p>
                <div class="login-users">
                    <button class="login-user-btn ali-btn" data-user="ali">
                        <span class="user-avatar">👨</span>
                        <span class="user-name">Ali</span>
                    </button>
                    <button class="login-user-btn aya-btn" data-user="aya">
                        <span class="user-avatar">👩</span>
                        <span class="user-name">Aya</span>
                    </button>
                </div>
            </div>

            <div id="login-code" class="login-code" hidden>
                <p id="login-code-prompt" class="login-prompt"></p>
                <div class="passcode-dots" id="passcode-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="passcode-keypad">
                    <button class="key-btn" data-key="1">1</button>
                    <button class="key-btn" data-key="2">2</button>
                    <button class="key-btn" data-key="3">3</button>
                    <button class="key-btn" data-key="4">4</button>
                    <button class="key-btn" data-key="5">5</button>
                    <button class="key-btn" data-key="6">6</button>
                    <button class="key-btn" data-key="7">7</button>
                    <button class="key-btn" data-key="8">8</button>
                    <button class="key-btn" data-key="9">9</button>
                    <button class="key-btn key-fn" data-key="clear">⌫</button>
                    <button class="key-btn" data-key="0">0</button>
                    <button class="key-btn key-fn key-enter" data-key="enter">✓</button>
                </div>
                <p id="login-error" class="login-error"></p>
                <button id="login-back" class="login-back-link">← Back</button>
            </div>
        </div>
    </div>

    <!-- ===================== DASHBOARD ===================== -->
    <div id="view-dashboard" class="view">
        <div class="view-scroll">
            <header class="dash-header">
                <div>
                    <h1 class="dash-hello" id="dash-hello"></h1>
                    <div class="dash-sub-row">
                        <p class="dash-days" id="dash-days"></p>
                        <span class="sync-pill" id="sync-status-pill">☁️ Synced</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
                    <button id="logout-btn" class="icon-btn" aria-label="Logout">🚪</button>
                </div>
            </header>

            <!-- Instant Miss You Button -->
            <button id="miss-you-btn" class="miss-you-card glass">
                <span class="miss-you-icon">💖</span>
                <div class="miss-you-text">
                    <p class="miss-you-title">I Miss You!</p>
                    <p class="miss-you-sub">Tap to send instant love</p>
                </div>
            </button>

            <!-- Partner mood & presence -->
            <div class="dash-card partner-mood-card glass" id="dash-mood-card" data-nav="mood" style="cursor: pointer;">
                <span class="partner-mood-emoji" id="dash-partner-mood">🤍</span>
                <div class="partner-mood-info">
                    <div class="partner-name-row">
                        <p class="partner-mood-name" id="dash-partner-name"></p>
                        <span class="presence-badge" id="dash-partner-presence"><span class="presence-dot offline"></span> Offline</span>
                    </div>
                    <p class="partner-mood-status" id="dash-partner-status">Not checked in yet</p>
                </div>
            </div>

            <!-- Today's note -->
            <div class="dash-card note-card glass" id="dash-note-card">
                <p class="note-card-text" id="dash-note-text">💕</p>
                <p class="note-card-from" id="dash-note-from"></p>
            </div>

            <!-- Feature grid -->
            <div class="feature-grid">
                <button class="feature-btn glass" data-nav="letters">
                    <span class="feature-emoji">💌</span>
                    <span class="feature-label">Letters</span>
                    <span class="feature-badge" id="unread-badge" hidden>0</span>
                </button>
                <button class="feature-btn glass" data-nav="memories">
                    <span class="feature-emoji">📸</span>
                    <span class="feature-label">Memories</span>
                </button>
                <button class="feature-btn glass" data-nav="timeline">
                    <span class="feature-emoji">📅</span>
                    <span class="feature-label">Our Story</span>
                </button>
                <button class="feature-btn glass" data-nav="countdown">
                    <span class="feature-emoji">⏳</span>
                    <span class="feature-label">Milestones</span>
                </button>
                <button class="feature-btn glass" data-nav="mood">
                    <span class="feature-emoji">😊</span>
                    <span class="feature-label">Daily Mood</span>
                </button>
                <button class="feature-btn glass" data-nav="daily">
                    <span class="feature-emoji">❓</span>
                    <span class="feature-label">Daily Q&A</span>
                </button>
                <button class="feature-btn glass" data-nav="voicenotes">
                    <span class="feature-emoji">🎙️</span>
                    <span class="feature-label">Voice Memos</span>
                </button>
                <button class="feature-btn glass" data-nav="bucketlist">
                    <span class="feature-emoji">📝</span>
                    <span class="feature-label">Bucket List</span>
                </button>
                <button class="feature-btn glass" data-nav="lovenotes">
                    <span class="feature-emoji">💕</span>
                    <span class="feature-label">Sweet Notes</span>
                </button>
                <button class="feature-btn glass" data-nav="ourstory">
                    <span class="feature-emoji">🌹</span>
                    <span class="feature-label" id="dash-ourstory-label">For You</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===================== LETTERS ===================== -->
    <div id="view-letters" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>💌 Love Letters</h2>
        </header>
        <div class="view-scroll" id="letters-list"></div>
        <button class="fab" id="fab-letter" aria-label="Write letter">✏️</button>
    </div>

    <!-- ===================== DAILY QUESTION ===================== -->
    <div id="view-daily" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>❓ Question of the Day</h2>
        </header>
        <div class="view-scroll" id="daily-content"></div>
    </div>

    <!-- ===================== VOICE NOTES ===================== -->
    <div id="view-voicenotes" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>🎙️ Voice Memos</h2>
        </header>
        <div class="view-scroll" id="voicenotes-content"></div>
        <button class="fab" id="fab-voicenote" aria-label="Record voice note">🎙️</button>
    </div>

    <!-- ===================== MEMORIES ===================== -->
    <div id="view-memories" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>📸 Our Memories</h2>
            <button id="slideshow-btn" class="icon-btn" style="margin-left:auto;" aria-label="Play slideshow">🎬</button>
        </header>
        <div class="view-scroll">
            <div class="memories-grid" id="memories-grid"></div>
        </div>
        <button class="fab" id="fab-memory" aria-label="Add memory">📷</button>
    </div>

    <!-- ===================== TIMELINE ===================== -->
    <div id="view-timeline" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>📅 Our Story</h2>
        </header>
        <div class="view-scroll">
            <div class="tl-line" id="timeline-list"></div>
        </div>
        <button class="fab" id="fab-timeline" aria-label="Add milestone">➕</button>
    </div>

    <!-- ===================== COUNTDOWN ===================== -->
    <div id="view-countdown" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>⏳ Milestones</h2>
        </header>
        <div class="view-scroll" id="countdown-content"></div>
        <button class="fab" id="fab-countdown" aria-label="Add date">➕</button>
    </div>

    <!-- ===================== MOOD ===================== -->
    <div id="view-mood" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>😊 How are you today?</h2>
        </header>
        <div class="view-scroll" id="mood-content"></div>
    </div>

    <!-- ===================== BUCKET LIST ===================== -->
    <div id="view-bucketlist" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>📝 Our Bucket List</h2>
        </header>
        <div class="view-scroll" id="bucketlist-content"></div>
        <button class="fab" id="fab-bucket" aria-label="Add goal">➕</button>
    </div>

    <!-- ===================== LOVE NOTES ===================== -->
    <div id="view-lovenotes" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2>💕 Sweet Words</h2>
        </header>
        <div class="view-scroll" id="lovenotes-content"></div>
        <button class="fab" id="fab-lovenote" aria-label="Write note">✏️</button>
    </div>

    <!-- ===================== OUR STORY ===================== -->
    <div id="view-ourstory" class="view">
        <header class="view-header">
            <button class="back-btn" data-nav="dashboard">←</button>
            <h2 id="ourstory-header-title">🌹 Our Story</h2>
        </header>
        <div class="view-scroll story-scroll" id="ourstory-content">
            <!-- Rendered dynamically by renderOurStory(currentUser) in app.js -->
        </div>
    </div>
        </div>
    </div>

    <!-- ===================== MODAL ===================== -->
    <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal-card glass" id="modal-card">
            <div class="modal-handle"></div>
            <button class="modal-close" id="modal-close">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- ===================== LIGHTBOX ===================== -->
    <div id="lightbox" class="lightbox" hidden>
        <button class="lightbox-close" id="lightbox-close">✕</button>
        <img id="lightbox-img" src="" alt="Memory" />
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>

    <!-- ===================== TOAST ===================== -->
    <div id="toast" class="toast" hidden></div>

    <!-- ===================== FLOATING LOVE BUTTON ===================== -->
    <button id="love-burst-btn" class="love-burst-btn" aria-label="Send love">💖</button>

    <!-- Music toggle -->
    <button id="music-btn" class="music-btn" aria-label="Toggle music">
        <span class="music-icon">🎵</span>
        <span class="music-bars">
            <span></span><span></span><span></span>
        </span>
    </button>

    <!-- Native Audio Player (100% compatible with iOS PWA & Offline) -->
    <audio id="bg-audio" src="music.mp3" loop playsinline preload="auto"></audio>

    <!-- Main app -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
